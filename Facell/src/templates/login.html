<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - FACCELL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <div class="container text-center mt-5">

        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" width="110" class="mb-3">

        <div class="login-card mx-auto p-5">
            <h2 class="fw-bold mb-4">INGRESO</h2>

            <!-- Mensaje de error (solo aparece si el controlador manda "error") -->
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                    <input type="text" class="form-control" name="usuario" placeholder="Usuario">
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" name="clave" placeholder="Contraseña">
                </div>

                <button type="submit" class="btn btn-info text-white px-4">Entrar</button>
            </form>

            <p class="mt-3 mb-0"><a href="#" class="text-dark text-decoration-none">¿Olvidaste tu contraseña?</a></p>
        </div>

    </div>
</body>
</html>
