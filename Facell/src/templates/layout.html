<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACCELL</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Iconos de Bootstrap y tipo de letra -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">

            <!-- Menú lateral -->
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <div class="d-flex align-items-center gap-2 mb-4">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" width="56">
                    <span class="fs-3 fw-bold">FACCELL</span>
                </div>

                <!-- request.blueprint nos dice en qué módulo estamos, así marcamos "active" -->
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'home' %}active{% endif %}" href="{{ url_for('home.home') }}">
                            <i class="bi bi-grid"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'products' %}active{% endif %}" href="{{ url_for('products.list_products') }}">
                            <i class="bi bi-cart3"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'clients' %}active{% endif %}" href="{{ url_for('clients.list_clients') }}">
                            <i class="bi bi-person-plus"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'sales' %}active{% endif %}" href="{{ url_for('sales.list_sales') }}">
                            <i class="bi bi-graph-up"></i> Ventas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'suppliers' %}active{% endif %}" href="{{ url_for('suppliers.list_suppliers') }}">
                            <i class="bi bi-truck"></i> Proveedores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.blueprint == 'users' %}active{% endif %}" href="{{ url_for('users.list_users') }}">
                            <i class="bi bi-person-circle"></i> Usuarios
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-9 col-lg-10 p-4">
                {% block content %}
                {% endblock %}
            </main>

        </div>
    </div>
</body>
</html>
